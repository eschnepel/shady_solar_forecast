name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout shady_solar_forecast
        uses: actions/checkout@v6
        with:
          path: shady_solar_forecast

      - name: Read shadylib version from pyproject.toml
        id: shadylib_version
        run: |
          VERSION=$(python3 -c "
          import tomllib, pathlib
          d = tomllib.loads(pathlib.Path('shady_solar_forecast/pyproject.toml').read_text())
          entry = next(e for e in d['dependency-groups']['dev'] if isinstance(e, str) and 'shadylib' in e)
          print(entry.split('@')[-1])
          ")
          echo "ref=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout shadylib
        uses: actions/checkout@v6
        with:
          repository: eschnepel/shadylib
          path: shadylib
          ref: ${{ steps.shadylib_version.outputs.ref }}

      - name: Vendor shadylib into custom_components
        run: |
          cp -r shadylib/src/shadylib \
            shady_solar_forecast/custom_components/shady/shadylib

      - name: Update manifest.json version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' \
            shady_solar_forecast/custom_components/shady/manifest.json \
            > /tmp/manifest.json
          mv /tmp/manifest.json \
            shady_solar_forecast/custom_components/shady/manifest.json

      - name: Generate strings.json from translations/en.json
        run: |
          cp shady_solar_forecast/custom_components/shady/translations/en.json \
            shady_solar_forecast/custom_components/shady/strings.json

      - name: Build release ZIP
        run: |
          cd shady_solar_forecast/custom_components/shady
          zip -r ../../../shady_solar_forecast.zip . \
            --exclude "*/tests/*"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: shady_solar_forecast.zip
          generate_release_notes: true