name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout shady_solar_forecast
        uses: actions/checkout@v6
        with:
          path: shady_solar_forecast

      - name: Checkout shadylib
        uses: actions/checkout@v6
        with:
          repository: eschnepel/shadylib
          path: shadylib

      - name: Vendor shadylib into custom_components
        run: |
          cp -r shadylib/src/shadylib \
            shady_solar_forecast/custom_components/shady/shadylib

      - name: Build release ZIP
        run: |
          cd shady_solar_forecast
          zip -r ../shady_solar_forecast.zip custom_components/
          cd ..

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --generate-notes \
            shady_solar_forecast.zip