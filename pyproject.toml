[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shady"
version = "1.0.0"
description = "Solar forecast correction – HA-dependent part using shadylib as it's core"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache 2.0" }
keywords = ["solar", "forecast", "home-assistant", "regression"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Topic :: Home Automation",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
  "mypy",
  "pre-commit",
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "ruff",
  "shadylib @ git+https://github.com/eschnepel/shadylib.git@v1.3.1",
]

[tool.setuptools.packages.find]
where = ["custom_components"]

[tool.mypy]
python_version = "3.12"
mypy_path = "."
no_namespace_packages = true
ignore_missing_imports = true
warn_unused_ignores = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"conftest.py" = ["E402", "F821"]
"custom_components/shady/__init__.py" = ["F821"]

[tool.pytest.ini_options]
testpaths = ["custom_components/shady/tests"]
asyncio_mode = "auto"
pythonpath = ["custom_components"]
